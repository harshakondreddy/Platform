version: '2.1'
services:
  postgres:
    container_name: postgres
    image: igs-wms-docker-stable-local.artifactory-na.honeywell.com/reds-postgres:0.0.2
    ports:
      - 5432:5432
    volumes:
    - postgresdata:/var/lib/postgresql/data
    command: postgres -c 'max_connections=20000' -c 'wal_level=logical' -c 'max_wal_senders=50' -c 'max_replication_slots=50'
    environment:
      - POSTGRES_ROOT_PASSWORD=admin123
      - POSTGRES_MULTIPLE_DATABASES="putaway","aislelinx","businessorchestrator","asrsmanager","asrsclient","inventory","container","location","socketproxy","momentumconnect","liftlinx","amr","crane","shuttle","routing","print","capacitymanager","workassignment","taskmanager","order","routingclient","shipping","wave","wmssimulator"
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=Password1

volumes:
  postgresdata:
    driver: local

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "198.168.1.1/24"

