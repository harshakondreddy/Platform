<source>
  @type forward
  port 24224
</source>
<filter docker>
  @type concat
  key log
  separator ""
  stream_identity_key container_id
  multiline_start_regexp /^[0-9]{4}-[0-9]{2}-[0-9]{2}\s[0-9].?[:][0-9]{2}:[0-9]{2}[.][0-9]{3}/
  multiline_end_regexp /^\s+\.\.\.$/
  flush_interval 5
  timeout_label @NORMAL
</filter>


<match **>
  @type relabel
  @label @NORMAL
</match>


<label @NORMAL>
#   <filter *.*>
#      @type parser
#      format json
#      key_name log
#      reserve_data true
#     # suppress_parse_error_log true
#    </filter>
<filter docker>
  @type parser
  key_name log
  reserve_data true
 # suppress_parse_error_log true
  <parse>
    @type multiline_grok
    #grok_pattern %{DATA:timestamp}\s+%{LOGLEVEL:log_level}\s+\[%{DATA:component_name},%{DATA:trace_id},%{DATA:span_id},%{DATA:exported_to_zipkins}\]\s+%{DATA:pid}\s+---\s+\[\s*%{DATA:thread}\]\s+%{DATA:class}\s+:\s+%{GREEDYDATA:message}
    grok_pattern %{DATA:timestamp}\s+%{LOGLEVEL:log_level}\s*\[%{DATA:component_name},%{DATA:trace_id},%{DATA:span_id}\s+---\s+\[\s*%{DATA:thread}\]\s+%{DATA:class}\s+:\s+%{GREEDYDATA:message}
  </parse>
</filter>
<filter docker>
  @type elasticsearch_timestamp_check
</filter>


<match docker>
  @type elasticsearch
  host <hostname>
  port 9200
  logstash_format true
  logstash_prefix fluentd
  logstash_dateformat %Y%m%d
  include_tag_key true
  type_name container
  tag_key @log_name
 flush_interval 10s
  buffer_chunk_limit_size 16m
  compress gzip
  buffer_flush_mode interval
  buffer_flush_thread_count 8
  buffer_retry_type exponential_backoff
  buffer_retry_timeout 1h
  buffer_retry_max_interval 30
  buffer_overflow_action drop_oldest_chunk
</match>
</label>

