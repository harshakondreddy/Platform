buildscript {

    ext {
        springBootVersion = '2.1.13.RELEASE'
        springCloudVersion = 'Greenwich.SR2'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
apply plugin: "maven"
apply plugin: "io.spring.dependency-management"

group = 'com.hon.reds.platform'
version = '2.0.0'

description = """spring-cloud-config-server"""

sourceCompatibility = 11
targetCompatibility = 11
tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}



repositories {
            
    mavenCentral()
}
dependencies {
    compile group: 'org.springframework.cloud', name: 'spring-cloud-config-server'
    compile("org.springframework.cloud:spring-cloud-starter-netflix-eureka-client")
    compile('org.springframework.cloud:spring-cloud-starter-stream-rabbit')
    compile group: 'org.springframework.cloud', name: 'spring-cloud-config-monitor', version: '1.1.0.RELEASE'
    testCompile('org.springframework.boot:spring-boot-starter-test')
    testCompile group: 'org.springframework.cloud', name: 'spring-cloud-stream-test-support', version:'2.0.0.RELEASE'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

